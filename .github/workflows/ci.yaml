name: test

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  # Cancel previous actions from the same PR: https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # matrix-prep-* steps generate JSON used to create a dynamic actions matrix.
  # Inspired from
  # https://stackoverflow.com/questions/65384420/how-to-make-a-github-action-matrix-element-conditional

  matrix-prep-os:
    # Prepares the 'os' axis of the test matrix, to reduce costs since GitHub hosted runners cost more on some platforms.
    # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - id: linux
        run: echo "os=ubuntu-latest" >> $GITHUB_OUTPUT
    outputs:
      # Will look like ["ubuntu-latest"]
      os: ${{ toJSON(steps.*.outputs.os) }}

  matrix-prep-bazelversion:
    # Prepares the 'bazelversion' axis of the test matrix
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bazel_91
        run: echo "bazelversion=9.1.0" >> $GITHUB_OUTPUT
      - id: bazel_86
        run: echo "bazelversion=8.6.0" >> $GITHUB_OUTPUT
      - id: bazel_83
        run: echo "bazelversion=8.3.0" >> $GITHUB_OUTPUT
      - id: bazel_76
        run: echo "bazelversion=7.6.1" >> $GITHUB_OUTPUT
    outputs:
      # Will look like ["<version from .bazelversion>", "x.y.z"]
      bazelversions: ${{ toJSON(steps.*.outputs.bazelversion) }}

  test:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    needs:
      - matrix-prep-bazelversion
      - matrix-prep-os

    # Run bazel test in each workspace with each version of Bazel supported
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-prep-os.outputs.os) }}
        bazelversion: ${{ fromJSON(needs.matrix-prep-bazelversion.outputs.bazelversions) }}
        folder:
          - .
          - e2e/smoke

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes --enable_bzlmod
            test --test_output=errors

      - name: Configure Bazel version
        working-directory: ${{ matrix.folder }}
        run: echo "${{ matrix.bazelversion }}" > .bazelversion

      # See https://github.com/bazel-contrib/publish-to-bcr#including-patches
      - name: verify bcr patches
        if: hashFiles('.bcr/patches/*.patch') != ''
        run: patch --dry-run -p1 < .bcr/patches/*.patch

      - name: Test
        working-directory: ${{ matrix.folder }}
        if: ${{ matrix.bazelversion >= '9.' || matrix.folder != '.' }}
        run: bazel test //...

      # Stardoc has output changes between versions
      - name: Test no doc 8 and lower
        working-directory: ${{ matrix.folder }}
        if: ${{ matrix.bazelversion <= '8.' && matrix.folder == '.' }}
        run: bazel query 'tests(//...) except docs/...' | xargs bazel test

  # Runs the build through actiond, a local Remote Execution API worker that
  # executes each action inside an empty chroot in a Linux VM on the runner.
  # This is what keeps remote-execution support from regressing: an action that
  # depends on the executor's userspace, or that opts out of remote execution,
  # fails here and nowhere else. x86_64 only - GitHub's arm64 Linux runners
  # have no /dev/kvm.
  remote-execution:
    name: Build examples/wolfi-base via actiond
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # Clone the repository
    env:
      ACTIOND_VERSION: v0.0.6
      ACTIOND_ENDPOINT: 127.0.0.1:8980

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable KVM and vhost-vsock
        run: |
          set -euxo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          if [[ ! -e /dev/vhost-vsock ]]; then
            sudo modprobe vhost_vsock
          fi
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/vhost-vsock

      - name: Download actiond
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          gh release download "${ACTIOND_VERSION}" \
            --repo hermeticbuild/actiond \
            --pattern 'linux-actiond_linux_x86_64' \
            --pattern 'SHA256.txt' \
            --clobber
          # SHA256.txt is sha256sum-format. This only proves the download is
          # intact; actiond publishes no build provenance to verify against.
          sha256sum -c --ignore-missing SHA256.txt
          chmod +x linux-actiond_linux_x86_64

      - name: Start actiond worker
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          setsid ./linux-actiond_linux_x86_64 serve-vm \
            --listen="${ACTIOND_ENDPOINT}" \
            --root="${RUNNER_TEMP}/actiond-root" \
            --cas-image-size-mib=8192 \
            --memory-mib=4096 \
            --cpus=4 \
            --start-timeout-ms=180000 \
            >"${RUNNER_TEMP}/actiond.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/actiond.pid"

          # The worker is ready when it logs the gRPC bridge endpoint.
          for _ in $(seq 1 240); do
            if grep -Fq "actiond VM raw gRPC bridge listening on ${ACTIOND_ENDPOINT}" "${RUNNER_TEMP}/actiond.log"; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/actiond.pid")" 2>/dev/null; then
              echo "actiond exited before becoming ready" >&2
              cat "${RUNNER_TEMP}/actiond.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "timed out waiting for ${ACTIOND_ENDPOINT}" >&2
          cat "${RUNNER_TEMP}/actiond.log" >&2
          exit 1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes

      # Regression gate for remote execution. --spawn_strategy=remote with no
      # local fallback means an action that opts out of remote execution (a
      # no-remote-exec tag, as in #332) fails the build outright rather than
      # quietly running on the host and passing. requires-bash is needed
      # because rules_apko stages inputs with run_shell actions; everything
      # they call is either a bash builtin or comes from the coreutils
      # toolchain, so nothing else is inherited from the executor.
      - name: Build examples/wolfi-base with remote execution
        run: |
          set -euxo pipefail
          bazel build //examples/wolfi-base \
            --remote_executor="grpc://${ACTIOND_ENDPOINT}" \
            --remote_cache="grpc://${ACTIOND_ENDPOINT}" \
            --remote_default_exec_properties=requires-bash= \
            --remote_upload_local_results=false \
            --noremote_cache_compression \
            --spawn_strategy=remote \
            --remote_local_fallback=false \
            --verbose_failures

      - name: Stop actiond
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/actiond.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/actiond.pid")" 2>/dev/null || true
          fi

      - name: Upload actiond log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actiond-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/actiond.log

  # Single summary gate that aggregates the dynamic test matrix. Branch
  # protection only needs to require this one context, so the Bazel version
  # matrix above can change without an infra change to the required checks.
  test-roundup:
    runs-on: ubuntu-latest
    needs:
      - matrix-prep-bazelversion
      - matrix-prep-os
      - remote-execution
      - test
    if: always()
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify needs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          jq -e 'all(.[]; .result | IN("success","skipped"))' <<< "$NEEDS_JSON"
