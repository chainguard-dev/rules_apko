# Experiment: build examples/wolfi-base through actiond, a local hermetic
# Remote Execution API worker that runs Bazel actions inside a Linux VM.
# https://github.com/hermeticbuild/actiond
#
# x86_64 only. GitHub's arm64 Linux runners have no /dev/kvm (the Azure
# DPDsv6 SKU does not support nested virtualization), and the macOS arm64
# runners cannot nest under Apple's Virtualization Framework.
name: actiond

on:
  push:
    branches: ['main', 'actiond**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ACTIOND_VERSION: v0.0.6
  ACTIOND_ENDPOINT: 127.0.0.1:8980

jobs:
  remote-execution:
    name: Build examples/wolfi-base via actiond
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # Clone the repository

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable KVM and vhost-vsock
        run: |
          set -euxo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          if [[ ! -e /dev/vhost-vsock ]]; then
            sudo modprobe vhost_vsock
          fi
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/vhost-vsock

      - name: Download actiond
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          gh release download "${ACTIOND_VERSION}" \
            --repo hermeticbuild/actiond \
            --pattern 'linux-actiond_linux_x86_64' \
            --pattern 'SHA256.txt' \
            --clobber
          # SHA256.txt is sha256sum-format. This only proves the download is
          # intact; actiond publishes no build provenance to verify against.
          sha256sum -c --ignore-missing SHA256.txt
          chmod +x linux-actiond_linux_x86_64

      - name: Start actiond worker
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          setsid ./linux-actiond_linux_x86_64 serve-vm \
            --listen="${ACTIOND_ENDPOINT}" \
            --root="${RUNNER_TEMP}/actiond-root" \
            --cas-image-size-mib=8192 \
            --memory-mib=4096 \
            --cpus=4 \
            --start-timeout-ms=180000 \
            >"${RUNNER_TEMP}/actiond.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/actiond.pid"

          # The worker is ready when it logs the gRPC bridge endpoint.
          for _ in $(seq 1 240); do
            if grep -Fq "actiond VM raw gRPC bridge listening on ${ACTIOND_ENDPOINT}" "${RUNNER_TEMP}/actiond.log"; then
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/actiond.pid")" 2>/dev/null; then
              echo "actiond exited before becoming ready" >&2
              cat "${RUNNER_TEMP}/actiond.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "timed out waiting for ${ACTIOND_ENDPOINT}" >&2
          cat "${RUNNER_TEMP}/actiond.log" >&2
          exit 1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes

      # Expected to fail today. rules_apko stages action inputs with
      # run_shell commands (mkdir/cp, see apko/private/apko_config.bzl), and
      # actiond's guest chroot ships only bash plus an /usr/bin/env stub, so
      # these die with "mkdir: command not found" (exit 127).
      - name: Build examples/wolfi-base with remote execution
        run: |
          set -euxo pipefail
          bazel build //examples/wolfi-base \
            --remote_executor="grpc://${ACTIOND_ENDPOINT}" \
            --remote_cache="grpc://${ACTIOND_ENDPOINT}" \
            --remote_default_exec_properties=requires-bash= \
            --remote_upload_local_results=false \
            --noremote_cache_compression \
            --remote_local_fallback=false \
            --verbose_failures

      # CopyToWorkdir fails before the apko action is ever scheduled, which
      # hides what #379 changed. Run the staging actions locally so the apko
      # action itself reaches the VM and its own failure mode is visible.
      # Non-blocking: this step exists to produce a log, not a verdict.
      - name: Diagnostic - isolate the apko action
        if: always()
        continue-on-error: true
        run: |
          set -uxo pipefail
          bazel build //examples/wolfi-base \
            --remote_executor="grpc://${ACTIOND_ENDPOINT}" \
            --remote_cache="grpc://${ACTIOND_ENDPOINT}" \
            --remote_default_exec_properties=requires-bash= \
            --remote_upload_local_results=false \
            --noremote_cache_compression \
            --remote_local_fallback=false \
            --strategy=CopyToWorkdir=local \
            --verbose_failures

      - name: Stop actiond
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/actiond.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/actiond.pid")" 2>/dev/null || true
          fi

      - name: Upload actiond log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actiond-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/actiond.log
